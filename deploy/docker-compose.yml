# Runtime constraints for a process whose job is to be attacked.
#
# The threat model is not "an attacker finds the decoy" — that is the point.
# It is "an attacker finds a bug in the decoy", and every setting below is
# chosen so that the next thing they reach is nothing.

services:
  decoy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: deception-grid:1.0.0
    restart: unless-stopped

    ports:
      # host:container. The high ports inside are deliberate: binding 22 and 80
      # in the container would require CAP_NET_BIND_SERVICE, and a capability
      # held is a capability that can be abused.
      - "22:2222"
      - "80:8080"
      - "443:8081"

    # The whole image is immutable at runtime. A decoy has no reason to write
    # to its own filesystem, and an attacker who cannot write cannot stage.
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777,noexec,nosuid,nodev

    volumes:
      # The only durable path, and the only one not read-only.
      - ./captures:/captures:rw

    security_opt:
      # No setuid binary in the image can raise privilege, whatever it is.
      - no-new-privileges:true

    cap_drop:
      - ALL
    # Nothing is added back. The process binds high ports as a non-root user,
    # which needs no capability at all.

    user: "10001:10001"

    # A decoy under attack should die rather than take the host with it. These
    # are low on purpose: the workload is a few sockets and some parsing, so a
    # process that needs more than this has stopped doing its job.
    mem_limit: 128m
    pids_limit: 64
    cpus: 0.5

    # Outbound connections are not part of the job. A decoy that can reach the
    # internet is a staging point; one that cannot is a dead end.
    #
    # Uncomment for a grid that never needs to ship events off-box:
    # network_mode: none   # (remove `ports:` as well — nothing reaches it)

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      # Runs the analysis path, not a network probe: a decoy that answers the
      # socket but has stopped writing events is the failure that matters, and
      # a TCP check cannot see it.
      test: ["CMD", "python", "-m", "decoy.cli", "--version"]
      interval: 60s
      timeout: 5s
      retries: 3
